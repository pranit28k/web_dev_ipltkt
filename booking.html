
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h2>IPL 2026</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#matches">Matches</a></li>
                <li><a href="booking.html">Book Ticket</a></li>
                <li><a href="index.html#guidelines">Guidelines</a></li>
            </ul>
        </nav>
    </header>

    <!-- Booking Form -->
    <section class="booking-section">

        <h1>IPL Ticket Booking</h1>
        <p>Fill in your details to book your favourite match!</p>

        <form action="#" method="get">

            <!-- Name -->
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="40"
                required
            >

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit number"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                required
            >

            <!-- Match Selection -->
            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select a Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="CSK vs MI">CSK vs MI</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="KKR vs CSK">KKR vs CSK</option>
            </select>

            <!-- Stand Category -->
            <label for="stand">Select Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label>
            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                value="1"
                required
            >

            <!-- Additional Preferences -->
            <p>Additional Preferences:</p>

            <div class="booking-options">
                <input
                    type="checkbox"
                    id="food"
                    name="preferences"
                    value="Food"
                >
                <label for="food">Food and Beverages</label>
            </div>

            <div class="booking-options">
                <input
                    type="checkbox"
                    id="parking"
                    name="preferences"
                    value="Parking"
                >
                <label for="parking">Parking Required</label>
            </div>

            <!-- Buttons -->
            <div class="form-buttons">
                <button type="submit">Submit Booking</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>

    </section>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
